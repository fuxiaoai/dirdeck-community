<!doctype html>
<html lang="zh"><meta charset="UTF-8"><title>DirDeck community title artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:'Avenir Next','PingFang SC',sans-serif}.hero{width:1600px;height:480px;position:relative;overflow:hidden;padding:44px 70px;background:#f3f7ff;color:#3c5375;border-radius:24px}.hero:before{content:'';position:absolute;width:1100px;height:760px;right:-600px;top:-520px;border:2px solid #a4cafa80;border-radius:50%;box-shadow:0 0 0 24px #b9d3f31a,0 0 0 55px #b9d3f312;transform:rotate(-25deg)}.brand{display:flex;align-items:center;gap:18px;font-size:38px;font-weight:650;letter-spacing:-1px}.brand img{width:64px;height:64px;border-radius:14px}h1{position:relative;margin:26px 0 0;font-size:106px;line-height:1.2;font-weight:700;letter-spacing:-4px}.accent{background-image:radial-gradient(ellipse 82% 100% at 25% -22%,transparent 60%,#c4f3ff99 68%,#daf7ffbf 70%,transparent 75%),linear-gradient(108deg,#22478b 2%,#266ad1 29%,#137d9d 55%,#435eb2 81%,#344889);background-clip:text;-webkit-background-clip:text;color:transparent}.en h1{font-size:100px;line-height:1.19;letter-spacing:-4.5px}.dark{background:#121e31;color:#c7d6ed}.dark .accent{background-image:radial-gradient(ellipse 82% 100% at 25% -22%,transparent 60%,#f4ffffaa 68%,#ffffffd9 70%,transparent 75%),linear-gradient(108deg,#72a5ff 2%,#80b7ff 29%,#74d6ea 55%,#a6b7ff 81%,#88a7fa)}
.mobile{width:800px;height:440px;padding:34px 38px}.mobile .brand{font-size:36px;gap:14px}.mobile .brand img{width:56px;height:56px}.mobile h1{margin-top:20px;font-size:96px;line-height:1.2}.mobile.en h1{font-size:72px;line-height:1.1;letter-spacing:-3px}
</style>
<div class="hero"><div class="brand"><img src="../assets/icon.png" alt="">DirDeck</div><h1>重新定义<br><span class="accent">Mac 文件管理</span></h1></div>
<script>
const q=new URLSearchParams(location.search);document.querySelector('.hero').classList.toggle('dark',q.get('theme')==='dark');if(q.get('lang')==='en'){document.documentElement.lang='en';document.querySelector('.hero').classList.add('en');document.querySelector('h1').innerHTML='Mac file management.<br><span class="accent">Redefined.</span>'}
if(q.get('size')==='mobile'){document.querySelector('.hero').classList.add('mobile');if(q.get('lang')==='en')document.querySelector('h1').innerHTML='Mac file<br>management.<br><span class="accent">Redefined.</span>'}
</script></html>
