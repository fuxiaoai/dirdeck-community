name: 功能建议 / Feature request
description: 说说你要完成的任务，以及希望 DirDeck 如何帮忙。
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "欢迎使用中文或英文。请先搜索已有建议；如果已有相同想法，可以在原 Issue 中补充场景或点赞。"
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 你在完成什么任务？目前哪一步不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改善 / Proposed improvement
      description: 描述理想的操作方式或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法 / Current workaround
      description: 现在如何完成这件事？有什么限制？（选填）
  - type: textarea
    id: context
    attributes:
      label: 补充说明 / Additional context
      description: 可以附草图、脱敏截图或相关链接。（选填）
